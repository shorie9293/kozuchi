name: Flutter CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  flutter-ci:
    name: 'Flutter CI'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: 📦 Setup local packages
        run: |
          mkdir -p ../../packages
          git clone --depth 1 https://github.com/shorie9293/takamagahara-packages.git /tmp/takamagahara
          cp -r /tmp/takamagahara/packages/takamagahara_core ../../packages/
          cp -r /tmp/takamagahara/packages/takamagahara_ui ../../packages/
          rm -rf /tmp/takamagahara

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: 'stable'
          cache: true

      - name: Verify Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: 📝 Create .env
        run: |
          cat > .env << 'ENVEOF'
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          ACHIEVEMENT_API_URL=${{ secrets.ACHIEVEMENT_API_URL }}
          ENVEOF

      - name: Run static analysis (flutter analyze)
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test --no-pub
